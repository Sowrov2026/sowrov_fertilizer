<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Admin Login | Sowrov Fertilizer

</title>

<link rel="stylesheet"
href="assets/css/style.css">

<link rel="stylesheet"
href="assets/css/auth.css">

<link rel="stylesheet"
href="assets/css/responsive.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<section class="auth">

<div class="auth-container">

<div class="auth-left">

<h1>

Sowrov
<span>

Fertilizer

</span>

</h1>

<p>

Admin Control Panel

</p>

<img
src="assets/images/logo/logo.png"
alt="Logo">

</div>

<div class="auth-right">

<h2>

Admin Login

</h2>

<form id="adminLoginForm">

<input

type="email"

id="email"

placeholder="Admin Email"

required>

<input

type="password"

id="password"

placeholder="Password"

required>

<div class="remember">

<label>

<input
type="checkbox">

Remember Me

</label>

<a href="forgot-password.html">

Forgot Password?

</a>

</div>

<button
type="submit"
class="btn">

Login

</button>

</form>

<p class="back-home">

<a href="index.html">

← Back Home

</a>

</p>

</div>

</div>

</section>

<script type="module" src="assets/js/auth.js"></script>

</body>

</html>
