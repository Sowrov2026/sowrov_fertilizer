<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/cart.css">
</head>
<body>

    <div id="sf-navbar"></div>

    <section class="cart-page">
        <div class="container">
            <div class="section-header">
                <h2>Shopping Cart</h2>
                <p>Review your products before checkout</p>
            </div>
            <div class="cart-layout">
                <div class="cart-left">
                    <div id="cartItems"></div>
                </div>
                <div class="cart-right">
                    <div class="cart-summary">
                        <h3>Order Summary</h3>
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span id="subtotal">৳0</span>
                        </div>
                        <div class="summary-row">
                            <span>Delivery</span>
                            <span>৳100</span>
                        </div>
                        <hr>
                        <div class="summary-row total">
                            <strong>Grand Total</strong>
                            <strong id="grandTotal">৳0</strong>
                        </div>
                        <a href="/order.html" class="btn">Proceed Order</a>
                        <button id="clearCart" class="btn-outline">Clear Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="sf-footer"></div>

    <script type="module" src="assets/js/cart.js"></script>
    <script src="assets/js/component-loader.js"></script>
</body>
</html>
