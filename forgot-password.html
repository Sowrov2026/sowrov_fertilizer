<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Sowrov Fertilizer</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ECFDF5 0%,#F0FDF4 100%);padding:2rem 1rem;}
        .auth-card{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.08);padding:3rem 2.5rem;width:100%;max-width:420px;text-align:center;}
        .auth-card h2{font-size:1.4rem;margin-bottom:1rem;color:#1E293B;}
        .auth-card p{color:#64748B;font-size:0.9rem;margin-bottom:1.5rem;}
        .form-group{margin-bottom:1.2rem;text-align:left;}
        .form-group label{display:block;font-weight:600;margin-bottom:0.4rem;color:#1E293B;font-size:0.9rem;}
        .form-group input{width:100%;padding:12px 16px;border:2px solid #E2E8F0;border-radius:12px;font-size:0.95rem;outline:none;}
        .form-group input:focus{border-color:#2E7D32;}
        .auth-card .btn{width:100%;padding:14px;font-size:1rem;font-weight:700;border-radius:12px;margin-top:0.5rem;}
        .auth-links{margin-top:1.5rem;font-size:0.9rem;color:#64748B;}
        .auth-links a{color:#2E7D32;font-weight:600;}
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <h2>Forgot Password</h2>
            <p>Enter your registered email and we'll send you a password reset link.</p>
            <form id="forgotForm">
                <div class="form-group">
                    <label for="resetEmail">Email</label>
                    <input type="email" id="resetEmail" placeholder="your@email.com" required>
                </div>
                <button type="submit" class="btn">Send Reset Link</button>
            </form>
            <div class="auth-links">
                <p>Remember your password? <a href="/customer-login.html">Login</a></p>
                <p style="margin-top:0.5rem;"><a href="/">← Back to Home</a></p>
            </div>
        </div>
    </div>
    <script type="module">
    import { auth } from "assets/js/firebase.js";
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    const form = document.getElementById("forgotForm");
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("resetEmail").value.trim();
        if (!email) return;
        try {
            await sendPasswordResetEmail(auth, email);
            alert("Password reset link has been sent to your email.");
            window.location.href = "customer-login.html";
        } catch (error) {
            console.error(error);
            let msg = 'পাসওয়ার্ড রিসেট লিঙ্ক পাঠানো যায়নি।';
            if (error.code === 'auth/user-not-found') {
                msg = 'এই ইমেইল দিয়ে কোনো অ্যাকাউন্ট পাওয়া যায়নি।';
            } else if (error.code === 'auth/invalid-email') {
                msg = 'ইমেইল ঠিক নয়।';
            }
            alert(msg);
        }
    });
    </script>
</body>
</html>
