<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

<title>Track Order</title>

<link rel="stylesheet"
href="assets/css/style.css">

href="assets/css/pages.css">

<section class="contact-page">

<div class="container">

Track Your Order

</h2>

<p>

Enter your Order ID to check status

</p>

</div>

Track Order

</div>

</div>

</section>

<div id="sf-footer"></div>
