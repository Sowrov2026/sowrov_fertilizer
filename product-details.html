<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Product Details</title>

<link rel="stylesheet"
href="assets/css/style.css">

</head>

<body>

<header class="header">

<div class="container">

<nav class="navbar">

<a href="index.html" class="logo">

Sowrov <span>Fertilizer</span>

</a>

<ul class="nav-menu">

<li>

<a href="index.html">

Home

</a>

</li>

<li>

<a href="cart.html">

🛒 Cart

</a>

</li>

</ul>

</nav>

</div>

</header>

<section class="product-details-page">

<div class="container">

<div class="product-layout">

<!-- LEFT -->

<div class="product-images">

<img

id="mainImage"

class="main-image"

src=""

alt="">

<div

id="thumbnailGallery"

class="thumbnail-gallery">

</div>

</div>

<!-- RIGHT -->

<div class="product-info">

<h1 id="productName">

Loading...

</h1>

<div

class="product-price"

id="productPrice">

৳0

</div>

<div

id="productStock"

class="stock-status">

</div>

<p

id="productDescription">

</p>

<div

class="quantity-box">

<button id="minusQty">

-

</button>

<input

id="qty"

type="number"

value="1"

min="1">

<button id="plusQty">

+

</button>

</div>

<div class="product-buttons">

<button

id="addCart"

class="btn">

Add To Cart

</button>

<button

id="buyNow"

class="btn-outline">

Buy Now

</button>

</div>

<h3>

Features

</h3>

<ul id="featureList">

</ul>

<h3>

Specifications

</h3>

<table

id="specTable"

class="spec-table">

</table>

</div>

</div>

<hr>

<h2>

Related Products

</h2>

<div

id="relatedProducts"

class="product-grid">

</div>

</div>

</section>

<script

type="module"

src="assets/js/product-details.js">

</script>

</body>

</html>
